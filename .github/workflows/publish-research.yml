name: Publish research materials

on:
  push:
    branches: [main]
    paths:
      - '.github/release/**'
      - '.github/workflows/publish-research.yml'
  workflow_dispatch:

concurrency:
  group: research-reproducibility-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'hiiiy-pm/Endpoint-Definitions-and-Label-Provenance-in-Honey-Bee-Toxicity-Benchmarking' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
      GIT_CONFIG_KEY_1: core.longpaths
      GIT_CONFIG_VALUE_1: 'true'
    permissions:
      contents: write
    steps:
      - name: Check out the publication commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build and verify release assets
        shell: pwsh
        run: python .github/release/build_assets.py --output-dir "$env:RUNNER_TEMP/research-assets"
      - name: Publish verified release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/release/publish_release.py --output-dir "$env:RUNNER_TEMP/research-assets"
