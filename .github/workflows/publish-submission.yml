name: Publish study materials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-submission.yml'
      - '.github/release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-materials
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'hiiiy-pm/Endpoint-Definitions-and-Label-Provenance-in-Honey-Bee-Toxicity-Benchmarking' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Enable long research paths
        run: git config --global core.longpaths true
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install packaging runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Rebuild and verify all deliverables
        run: python .github/release/rebuild_materials.py --repository-root . --output-dir release_assets
      - name: Publish verified study materials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/release/publish_materials.py
